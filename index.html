<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>चुपाकाबरा - सुपर ऐप</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --g-bg: #f8fafd;
      --g-surface: #ffffff;
      --g-primary-blue: #0b57d0;
      --g-light-blue: #d3e3fd;
      --g-chip-bg: #edf2fa;
      --g-text-dark: #1f1f1f;
      --g-text-sub: #444746;
      --g-border: #e0e2ec;
      --g-green: #146c2e;
      --g-red: #b3261e;
      --radius-xl: 24px;
      --radius-lg: 18px;
      --radius-md: 12px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Noto Sans Devanagari', 'Plus Jakarta Sans', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--g-bg); color: var(--g-text-dark); padding-bottom: 96px; min-height: 100vh; }

    /* शीर्ष बार */
    .top-search-row { position: sticky; top: 0; background: #ffffff; z-index: 100; padding: 12px 16px; display: flex; align-items: center; gap: 12px; border-bottom: 1px solid var(--g-border); }
    .search-pill { flex: 1; background: var(--g-chip-bg); height: 46px; border-radius: 23px; display: flex; align-items: center; padding: 0 16px; gap: 10px; }
    .search-pill input { border: none; background: transparent; outline: none; width: 100%; font-size: 13.5px; color: var(--g-text-dark); }
    .profile-avatar { width: 40px; height: 40px; border-radius: 50%; background: #6b21a8; color: #fff; display: grid; place-items: center; font-size: 15px; font-weight: 700; cursor: pointer; }

    /* डायनामिक एनीमेशन व एड स्टेज */
    #adStageContainer { width: 100%; min-height: 150px; position: relative; overflow: hidden; border-bottom: 1px solid var(--g-border); background: #000; }
    #adCanvas { width: 100%; height: 150px; display: block; }
    .ad-overlay { position: absolute; inset: 0; display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; background: rgba(0,0,0,0.35); color: #fff; }

    /* चिप्स पट्टी */
    .chip-row { display: flex; gap: 8px; padding: 10px 16px; overflow-x: auto; background: #fff; border-bottom: 1px solid var(--g-border); }
    .chip-row::-webkit-scrollbar { display: none; }
    .g-chip { display: flex; align-items: center; gap: 6px; background: #fff; border: 1px solid var(--g-border); padding: 6px 12px; border-radius: 20px; font-size: 11.5px; font-weight: 600; white-space: nowrap; }

    /* त्वरित शॉर्टकट */
    .quick-actions-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; padding: 16px; background: #fff; border-bottom: 1px solid var(--g-border); text-align: center; }
    .qa-item { display: flex; flex-direction: column; align-items: center; cursor: pointer; }
    .qa-icon-box { width: 50px; height: 50px; border-radius: 16px; background: #e8f0fe; display: grid; place-items: center; font-size: 22px; margin-bottom: 6px; color: var(--g-primary-blue); }
    .qa-label { font-size: 11px; font-weight: 700; color: var(--g-text-dark); line-height: 1.2; }

    /* गद्दी संतुलन कार्ड */
    .money-manage-card { margin: 14px 16px; background: #fff; border: 1px solid var(--g-border); border-radius: var(--radius-xl); padding: 18px; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.03); }
    .net-box { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px dashed var(--g-border); }
    .net-val { font-size: 26px; font-weight: 800; color: var(--g-primary-blue); }
    .gaddi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
    .g-pill { padding: 10px 12px; border-radius: var(--radius-md); background: var(--g-chip-bg); }

    /* ग्रिड सिस्टम */
    .section-block { padding: 14px 16px 6px; }
    .section-head-title { font-size: 14px; font-weight: 800; color: var(--g-text-dark); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .dynamic-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px 8px; text-align: center; }
    .srv-icon { width: 50px; height: 50px; border-radius: 50%; border: 1px solid var(--g-border); background: #ffffff; display: grid; place-items: center; font-size: 22px; margin: 0 auto 6px; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }
    .srv-name { font-size: 11px; font-weight: 700; color: var(--g-text-dark); line-height: 1.2; }

    /* स्क्रीन पैनल्स */
    .app-screen { display: none; padding: 16px; }
    .app-screen.active { display: block; }

    /* फॉर्म कंट्रोल्स */
    .u-input { width: 100%; height: 44px; background: var(--g-chip-bg); border: 1px solid var(--g-border); border-radius: 12px; padding: 0 12px; font-size: 13px; outline: none; margin-bottom: 10px; }
    .btn-std { width: 100%; height: 44px; border: none; border-radius: 12px; font-weight: 800; font-size: 14px; cursor: pointer; }

    /* बॉटम डॉक */
    .bottom-dock { position: fixed; bottom: 0; left: 0; right: 0; height: 68px; background: #ffffff; border-top: 1px solid var(--g-border); display: flex; justify-content: space-between; align-items: center; padding: 0 6px; z-index: 100; }
    .dock-btn { flex: 1; background: transparent; border: none; display: flex; flex-direction: column; align-items: center; gap: 3px; color: var(--g-text-sub); font-size: 10.5px; font-weight: 700; cursor: pointer; }
    .dock-btn.active { color: var(--g-primary-blue); }
    .dock-btn div { font-size: 18px; }
    .docked-scan-btn { width: 50px; height: 50px; border-radius: 50%; background: var(--g-primary-blue); color: #fff; border: 3px solid #ffffff; box-shadow: 0 4px 12px rgba(11, 87, 208, 0.3); display: grid; place-items: center; font-size: 20px; cursor: pointer; transform: translateY(-10px); }
  </style>
</head>
<body>

  <!-- टॉप सर्च बार -->
  <header class="top-search-row">
    <div class="search-pill">
      <span>🔍</span>
      <input type="text" id="masterSearch" placeholder="सर्च करें...">
    </div>
    <div class="profile-avatar" id="topAvatar" onclick="window.powApp.switchScreen('provider', 'प्रोवाइडर खाता')">रा</div>
  </header>

  <!-- मुख्य होम स्क्रीन -->
  <main id="viewHome" class="app-screen active" style="padding:0;">
    <!-- लाइव एनीमेशन / विज्ञापन स्टेज (pow.js कंट्रोल) -->
    <div id="adStageContainer">
      <canvas id="adCanvas"></canvas>
      <div class="ad-overlay" id="adOverlayContent"></div>
    </div>

    <!-- 4 त्वरित शॉर्टकट -->
    <div class="quick-actions-grid" id="homeQuickActions"></div>

    <!-- चिप्स रो -->
    <div class="chip-row" id="homeChips"></div>

    <!-- गद्दी संतुलन कार्ड -->
    <section class="money-manage-card" id="homeGaddiCard"></section>

    <!-- ग्राहक बहीखाता -->
    <section class="section-block">
      <div class="section-head-title">
        <span>ग्राहक बहीखाता (Recent)</span>
        <span onclick="window.powApp.switchScreen('ledger', 'बहीखाता')" style="font-size:12px;color:var(--g-primary-blue);font-weight:700;cursor:pointer;">सभी देखें ↗</span>
      </div>
      <div class="dynamic-grid-4" id="homePeopleGrid"></div>
    </section>

    <!-- 8 विशिष्ट सेवाएँ -->
    <section class="section-block" style="padding-top:4px;">
      <div class="section-head-title">
        <span>सेवाएँ व आधिकारिक नेटवर्क (Services)</span>
      </div>
      <div class="dynamic-grid-4" id="homeServicesGrid"></div>
    </section>
  </main>

  <!-- डायनामिक मॉड्यूल स्क्रीन (क्लिनिक, मंडी, बहीखाता, PoW सब pow.js से लोड होगा) -->
  <section id="viewDynamicModule" class="app-screen">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:14px;">
      <button onclick="window.powApp.switchScreen('home')" style="border:none;background:none;color:var(--g-primary-blue);font-weight:800;cursor:pointer;font-size:14px;">← वापस होम</button>
      <span id="dynamicModuleTitle" style="font-size:13px;font-weight:700;color:var(--g-text-sub);">मॉड्यूल</span>
    </div>
    <div id="dynamicModuleContent"></div>
  </section>

  <!-- बॉटम डॉक -->
  <nav class="bottom-dock" id="bottomDockNav"></nav>

  <!-- मास्टर इंजन फ़ाइल -->
  <script src="pow.js"></script>
</body>
</html>
